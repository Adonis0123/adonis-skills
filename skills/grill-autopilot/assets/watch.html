<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grill 现场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650;12..96,750&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;650&display=swap">
<style>
/* Claude palette (Anthropic brand: ivory, pampas, cloud, clay) on the adonis-brand
   type, radius and spacing scale. Model marks carry their own hue; the UI keeps
   clay for live state and the one action. */
:root{
  color-scheme:light;
  --bg:#faf9f5;--bg-glass:rgb(250 249 245/.86);--surface:#ffffff;--sunk:#f0eee6;--sunk-2:#e8e6dc;
  --ink:#141413;--ink-2:#5e5d59;--ink-3:#73726c;
  --line:#e8e6dc;--line-strong:#d6d3c8;
  --accent:#d97757;--accent-solid:#c96442;--accent-solid-hover:#b4552f;--accent-ink:#a8502e;--accent-soft:#f6e6dc;--accent-line:#edc6b2;
  --ok:#5a6b43;--ok-soft:#e8ecdd;--info:#3d6a96;--info-soft:#e3ecf5;--bad:#a8382f;--bad-soft:#f6e0dc;
  --m-claude:#d97757;--m-claude-ink:#faf9f5;
  --m-codex:linear-gradient(160deg,#b1a7ff,#7a9dff 45%,#3941ff);--m-codex-ink:#ffffff;
  --m-grok:#141413;--m-grok-ink:#faf9f5;
  --m-pi:#7a68b8;--m-pi-ink:#ffffff;
  --m-ledger:#788c5d;--m-ledger-ink:#ffffff;
  --m-unknown:#b0aea5;--m-unknown-ink:#141413;
  --shadow:0 1px 2px rgb(20 20 19/.05),0 10px 28px -16px rgb(20 20 19/.18);
  --font-display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --font-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-xs:6px;--r-sm:10px;--r-md:12px;--r-lg:16px;--r-full:9999px;
  --gutter:20px;--ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#1f1e1d;--bg-glass:rgb(31 30 29/.86);--surface:#2b2a27;--sunk:#262624;--sunk-2:#33322f;
    --ink:#faf9f5;--ink-2:#c3c1b8;--ink-3:#9a988f;
    --line:#3a3935;--line-strong:#4a4844;
    --accent:#d97757;--accent-solid:#c96442;--accent-solid-hover:#d8754f;--accent-ink:#ec9b7d;--accent-soft:#3b2a22;--accent-line:#6a3f2d;
    --ok:#aebf91;--ok-soft:#2e3426;--info:#93b9df;--info-soft:#25303b;--bad:#f0968b;--bad-soft:#3d2523;
    --m-grok:#faf9f5;--m-grok-ink:#141413;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line-strong) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--font-body);font-feature-settings:"tnum" 0}
::selection{background:var(--accent-soft);color:var(--ink)}
a{color:var(--accent-ink);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
code{font:500 12.5px/1.6 var(--font-mono);background:var(--sunk);padding:1px 6px;border-radius:var(--r-xs);overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg-glass);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px var(--gutter);display:flex;align-items:center;gap:16px}
.title{display:flex;flex-direction:column;min-width:0;flex:1}
.title h1{margin:0;font:650 16px/1.3 var(--font-display);letter-spacing:-.01em}
.title .topic{font:500 12.5px/1.5 var(--font-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;align-items:center;gap:14px;font:500 12.5px/1 var(--font-mono);color:var(--ink-2)}
.live{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line);font:500 13px/1 var(--font-body);color:var(--ink-2);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.live[data-s="live"]{border-color:var(--accent-line);color:var(--accent-ink)}
.live[data-s="live"] i{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.live[data-s="done"] i{background:var(--m-ledger)}
.live[data-s="failed"]{color:var(--bad);border-color:var(--bad-soft)}
.live[data-s="failed"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}

/* seats */
.seats{max-width:980px;margin:0 auto;padding:16px var(--gutter) 4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color .25s var(--ease),background-color .25s var(--ease)}
.seat[data-active]{border-color:var(--accent-line);background:linear-gradient(var(--accent-soft),var(--surface) 140%)}
.seat>.av{grid-row:span 2}
.seat .role{font:500 12px/1.4 var(--font-body);color:var(--ink-3);display:flex;gap:6px;align-items:baseline}
.seat .who{display:flex;align-items:baseline;gap:6px;min-width:0}
.seat .who b{font:650 15px/1.3 var(--font-display);letter-spacing:-.01em}
.seat .who span{font:500 12px/1 var(--font-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .state{grid-column:1/-1;margin-top:8px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.5;color:var(--ink-2);display:flex;gap:8px;align-items:center;min-height:30px}
.seat[data-active] .state{color:var(--accent-ink);border-top-color:var(--accent-line)}
.seat .state .t{margin-left:auto;font:500 12px/1 var(--font-mono)}
.seat .sub{display:flex;gap:6px;align-items:center}
.tally{display:flex;gap:10px;font:500 12px/1 var(--font-mono);color:var(--ink-2)}
.tally span{display:inline-flex;gap:4px;align-items:center}
.tally i{width:6px;height:6px;border-radius:50%}

/* avatars */
.av{--s:36px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;background:var(--m-unknown);color:var(--m-unknown-ink)}
.av svg{width:58%;height:58%}
.av[data-m="ledger"] svg,.av[data-m="user"] svg{width:56%;height:56%}
.av.sm{--s:22px}
.av[data-m="claude"]{background:var(--m-claude);color:var(--m-claude-ink)}
.av[data-m="codex"]{background:var(--m-codex);color:var(--m-codex-ink)}
.av[data-m="grok"]{background:var(--m-grok);color:var(--m-grok-ink)}
.av[data-m="pi"]{background:var(--m-pi);color:var(--m-pi-ink)}
.av[data-m="ledger"]{background:var(--m-ledger);color:var(--m-ledger-ink)}
.av[data-m="user"]{background:var(--sunk-2);color:var(--ink)}
.stack{display:flex;align-items:flex-end;grid-row:span 2}
.stack .av.sm{margin-left:-10px;box-shadow:0 0 0 2px var(--surface)}

/* chat */
.chat{max-width:860px;margin:0 auto;padding:20px var(--gutter) 120px;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:12px;align-items:flex-start;max-width:min(680px,92%)}
.msg.right{align-self:flex-end;flex-direction:row-reverse}
.msg .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg.right .col{align-items:flex-end}
.name{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px;line-height:1.4;color:var(--ink-3);padding:0 4px}
.name b{font:650 14px/1.3 var(--font-display);color:var(--ink);letter-spacing:-.01em}
.name .acct{font:500 12px/1 var(--font-mono)}
.name .tag{font-size:12px;padding:2px 7px;border-radius:var(--r-xs);background:var(--sunk);color:var(--ink-2)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:6px var(--r-lg) var(--r-lg) var(--r-lg);padding:4px 18px;min-width:0;max-width:100%}
.right .bubble{background:var(--sunk);border-color:transparent;border-radius:var(--r-lg) 6px var(--r-lg) var(--r-lg)}
.bubble.plain{padding:12px 18px}
.bubble p{margin:0 0 .5em}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.2em 0 .5em;padding-left:1.3em}
.item{padding:14px 0}
.item+.item{border-top:1px solid var(--line)}
.right .item+.item{border-top-color:var(--sunk-2)}
.qh{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.qid{flex:none;font:500 12px/1 var(--font-mono);color:var(--accent-ink);background:var(--accent-soft);padding:4px 7px;border-radius:var(--r-xs)}
.qh h3{margin:0;font:650 15.5px/1.4 var(--font-body);letter-spacing:0}
.qh .of{font-size:13px;color:var(--ink-3);line-height:1.45}
.qbody{color:var(--ink-2);font-size:14.5px}
.rec{margin-top:10px;display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--ink-2)}
.rec svg{flex:none;width:14px;height:14px;color:var(--accent);transform:translateY(2px)}
.rec .lbl{flex:none;font-weight:500;color:var(--ink)}
.decision{font:500 15px/1.6 var(--font-body);color:var(--ink);margin:2px 0 4px}
.decision.open{color:var(--accent-ink)}
.reason{font-size:14.5px;color:var(--ink-2)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-full);font-size:12.5px;line-height:1;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.fact.warn{color:var(--accent-ink);border-color:var(--accent-line)}
.fact i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.ev{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.ev li{font:500 12.5px/1.55 var(--font-mono);color:var(--ink-2);overflow-wrap:anywhere;display:flex;gap:6px}
.ev li::before{content:"";flex:none;width:5px;height:5px;margin-top:.62em;border-radius:50%;background:var(--line-strong)}
details{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
summary{cursor:pointer;color:var(--ink-3);width:max-content;list-style:none;display:inline-flex;gap:6px;align-items:center;border-radius:var(--r-xs)}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s var(--ease)}
details[open] summary::before{transform:rotate(45deg) translate(-2px,-1px)}
summary:hover{color:var(--ink)}
details p{margin:6px 0 0}

/* judge */
.judge{align-self:center;width:min(600px,100%);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px}
.judge .jh{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.judge .jh b{font:650 14px/1.3 var(--font-display);color:var(--ink)}
.row{display:grid;grid-template-columns:44px auto 1fr;gap:10px;align-items:baseline;padding:7px 0;font-size:13.5px;line-height:1.5}
.row+.row{border-top:1px dashed var(--line)}
.row .qid{justify-self:start}
.row .why{color:var(--ink-2);min-width:0}
.row .why ul{margin:2px 0 0;padding-left:1.1em}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--r-full);font-size:12.5px;line-height:1;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st[data-s="Decided"]{background:var(--ok-soft);color:var(--ok)}
.st[data-s="Assumption"]{background:var(--info-soft);color:var(--info)}
.st[data-s="Escalation"]{background:var(--accent-soft);color:var(--accent-ink)}
.st[data-s="Invalid"]{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.st[data-s="hold"]{background:var(--ok-soft);color:var(--ok)}
.st[data-s="overturn"]{background:var(--bad-soft);color:var(--bad)}
.note{margin-top:8px;font-size:13px;color:var(--accent-ink)}
.sys{align-self:center;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-3);text-align:center;max-width:90%}
.sys[data-k="failed"]{color:var(--bad)}
.sys[data-k="fallback"]{color:var(--accent-ink)}
.round{align-self:stretch;display:flex;align-items:center;gap:12px;font:500 12px/1 var(--font-mono);color:var(--ink-3);margin-top:6px}
.round::before,.round::after{content:"";flex:1;height:1px;background:var(--line)}

/* typing */
.typing .bubble{display:flex;align-items:center;gap:12px;padding:12px 16px;border-style:dashed;border-color:var(--accent-line);box-shadow:none;background:var(--surface)}
.right.typing .bubble{background:var(--surface);border:1px dashed var(--accent-line)}
.typing .lbl{font-size:14px;color:var(--ink-2)}
.typing .t{font:500 12px/1 var(--font-mono);color:var(--ink-3)}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1.2s var(--ease) infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.judge.typing{display:flex;align-items:center;gap:10px;border-style:dashed;border-color:var(--accent-line)}

/* closing */
.close{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.close h2{margin:0 0 4px;font:750 22px/1.2 var(--font-display);letter-spacing:-.02em}
.close .lead{margin:0;color:var(--ink-2);font-size:14.5px}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.count{padding:12px 14px;border-radius:var(--r-md);background:var(--sunk)}
.count b{display:block;font:750 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--ink-2)}
.count[data-s="Escalation"]{background:var(--accent-soft)}
.count[data-s="Escalation"] b{color:var(--accent-ink)}
.close h3{margin:16px 0 6px;font:650 15px/1.4 var(--font-body)}
.esc{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.esc li{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:14px;line-height:1.55}
.esc .why{color:var(--ink-3);font-size:13px}
.esc .qid,.row .qid{align-self:start;justify-self:start}
.path{display:flex;gap:10px;align-items:center;margin-top:18px;padding:6px 6px 6px 14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md)}
.path code{flex:1;background:none;padding:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{flex:none;height:34px;padding:0 14px;border:0;border-radius:var(--r-full);background:var(--accent-solid);color:#fff;font:500 13.5px/1 var(--font-body);cursor:pointer;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--accent-solid-hover);transform:translateY(-1px)}
.btn:active{transform:none}

.empty{align-self:center;margin-top:12vh;text-align:center;color:var(--ink-2);max-width:420px}
.empty h2{margin:0 0 6px;font:650 18px/1.3 var(--font-display);color:var(--ink)}
.empty p{margin:0;font-size:14.5px}

.jump{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);height:38px;padding:0 16px;border-radius:var(--r-full);border:1px solid var(--accent-line);background:var(--surface);color:var(--accent-ink);font:500 13.5px/1 var(--font-body);box-shadow:0 8px 24px -10px rgb(20 20 19/.3);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.jump[hidden]{display:none}
.jump svg{width:14px;height:14px}

.enter{animation:enter .32s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:760px){
  .seats{grid-template-columns:1fr;gap:8px}
  .seat{grid-template-columns:auto 1fr auto;padding:10px 14px}
  .seat>.av,.seat>.stack{grid-row:1/span 2}
  .seat .role{grid-column:2;grid-row:1}
  .seat .who{grid-column:2;grid-row:2}
  .seat .state{grid-column:3;grid-row:1/span 2;margin:0;padding:0;border:0;min-height:0;font-size:12.5px;max-width:140px;justify-content:flex-end;text-align:right}
  .seat .state .t{margin-left:0}
  .seat .state .txt{display:none}
  .seat[data-active] .state{grid-column:1/-1;grid-row:3;max-width:none;justify-content:flex-start;text-align:left;margin-top:6px;padding-top:8px;border-top:1px dashed var(--accent-line);font-size:13.5px}
  .seat[data-active] .state .txt{display:inline}
  .seat[data-active] .state .t{margin-left:auto}
  .chat{gap:18px}
  .msg{gap:8px}
  .msg>.av{--s:28px}
  .bubble{padding:2px 14px}
  .bubble.plain{padding:10px 14px}
  .clock .el{display:none}
  .msg{max-width:100%}
  .row{grid-template-columns:40px 1fr}
  .row .why{grid-column:1/-1}
  .counts{gap:6px}
  .count{padding:10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="title"><h1>Grill 现场</h1><span class="topic" id="topic">正在连接…</span></div>
    <div class="clock"><span class="el num" id="round"></span><span class="num" id="elapsed">00:00</span><span class="live" id="live" data-s="connecting"><i></i><span>连接中</span></span></div>
  </div>
</header>
<section class="seats" id="seats" aria-label="三方席位"></section>
<main class="chat" id="chat" aria-live="polite"></main>
<button class="jump" id="jump" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span>有新消息</span></button>
<script>
"use strict";

// grill-ledger writes a fixed set of English reasons; show them in Chinese.
const WHY = [
  [/^reversible$/i, "可回退"],
  [/^hard to reverse, evidence strong enough$/i, "难回退，但证据够强"],
  [/^taste: .*/i, "口味问题：按仓库惯例取默认值，你可以推翻"],
  [/^side effect.*/i, "有副作用（安全、对外发送、付费或删除）"],
  [/^a fact only the user knows$/i, "只有你知道的事实"],
  [/^the Proxy could not settle it$/i, "Proxy 定不下来"],
  [/^hard to reverse with weak evidence$/i, "难回退且证据弱"],
  [/^answer changed (\d+) times$/i, "答案改了 $1 次"],
  [/^UNVERIFIED: answer still incomplete after re-ask.*$/i, "UNVERIFIED：退回一次后仍不完整"],
  [/^reached (\d+) rounds$/i, "已到 $1 轮上限"],
  [/^(\d+) rounds without a new decision$/i, "连续 $1 轮没有新决定"],
];
const zhWhy = s => { for (const [re, zh] of WHY) if (re.test(s)) return String(s).replace(re, zh); return s; };
function zhFix(f){
  if (/solution answers need/i.test(f)) return "方案类回答要附至少一个 URL 或仓库路径";
  const m = String(f).match(/^(add|set) `- ([A-Za-z ]+?):/);
  if (!m) return f;
  return m[1] === "add" ? `缺少 ${m[2]} 字段` : `${m[2]} 的取值不在允许范围内`;
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,'$1<a href="$2" target="_blank" rel="noreferrer">$2</a>');
}
function block(s){
  return String(s ?? "").trim().split(/\n\s*\n/).map(part => {
    const lines = part.split("\n");
    if (lines.every(l => /^\s*(?:[-*]|\d+[.)])\s+/.test(l))) {
      const ordered = /^\s*\d/.test(lines[0]);
      return `<${ordered?"ol":"ul"}>${lines.map(l => `<li>${inline(l.replace(/^\s*(?:[-*]|\d+[.)])\s+/,""))}</li>`).join("")}</${ordered?"ol":"ul"}>`;
    }
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}
const mm = ms => { const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600); const m = Math.floor(s%3600/60); const r = s%60; return (h?`${h}:${String(m).padStart(2,"0")}`:String(m).padStart(2,"0"))+":"+String(r).padStart(2,"0"); };
const clock = t => new Date(t).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
const av = (m, sm) => `<span class="av${sm?" sm":""}" data-m="${esc(m)}" aria-hidden="true">${MARKS[m] || MARKS.unknown}</span>`;
const seatOf = (st, key) => st.seats?.[key] || null;
const productName = seat => seat ? (PRODUCT[seat.product] || seat.product) : "未配置";

let S = null, skew = 0, gone = false;
const nodes = new Map();

function seatCard(key, role, en){
  const a = S.activity;
  const red = seatOf(S, "redteam");
  const active = a && (a.seat === key || (key === "judge" && a.seat === "redteam"));
  let avatar, who;
  if (key === "judge") {
    avatar = red ? `<span class="stack">${av("ledger")}${av(red.product, true)}</span>` : av("ledger");
    who = `<b>Ledger</b><span>${red ? `红队 ${esc(productName(red))}${red.account ? " · " + esc(red.account) : ""}` : "无红队"}</span>`;
  } else {
    const seat = seatOf(S, key);
    avatar = av(seat?.product);
    who = `<b>${esc(productName(seat))}</b>${seat?.account ? `<span>${esc(seat.account)}</span>` : ""}`;
  }
  const idle = {live: "等待中", done: "已完成", failed: "已中断"}[S.phase] || "等待中";
  const state = active
    ? `<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="txt">${esc(taskText(a))}</span><span class="t num" data-since="${a.since}">${mm(now() - a.since)}</span>`
    : `<span class="txt">${idle}</span>${key === "judge" ? tally() : ""}`;
  return `<div class="seat"${active ? " data-active" : ""}>${avatar}<span class="role">${role}<span>${en}</span></span><span class="who">${who}</span><div class="state">${state}</div></div>`;
}
function tally(){
  const t = S.totals || {};
  const n = k => (t[k] || []).length;
  return `<span class="tally t"><span style="color:var(--ok)"><i style="background:var(--ok)"></i>${n("Decided")}</span><span style="color:var(--info)"><i style="background:var(--info)"></i>${n("Assumption")}</span><span style="color:var(--accent-ink)"><i style="background:var(--accent)"></i>${n("Escalation")}</span></span>`;
}
const taskText = a => typeof TASK[a.task] === "function" ? TASK[a.task](a.round) : (TASK[a.task] || "工作中");
const now = () => Date.now() + skew;

function renderSeats(){
  $("seats").innerHTML =
    seatCard("interviewer","提问","Interviewer") +
    seatCard("proxy","代你回答","Proxy") +
    seatCard("judge","审判","Judge");
}

function nameRow(seat, tag, at, extra = ""){
  return `<div class="name"><b>${esc(productName(seat))}</b>${seat?.account?`<span class="acct">${esc(seat.account)}</span>`:""}<span class="tag">${tag}</span>${extra}<span class="num">${clock(at)}</span></div>`;
}
const titles = () => { const t = {}; for (const m of S.messages) if (m.role === "interviewer") for (const q of m.questions) t[q.id] = q.title; return t; };

function evidence(text){
  const items = String(text || "").split(/;\s*/).map(s => s.trim()).filter(s => s && !/^(none|n\/a|-|无)$/i.test(s));
  if (!items.length) return "";
  return `<ul class="ev">${items.map(s => {
    const url = s.match(/https?:\/\/[^\s)]+/)?.[0];
    if (!url) return `<li>${esc(s.replace(/^`|`$/g,""))}</li>`;
    let label = url; try { const u = new URL(url); label = u.host + (u.pathname === "/" ? "" : u.pathname); } catch {}
    return `<li><a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label)}</a></li>`;
  }).join("")}</ul>`;
}

function render(m){
  const T = titles();
  if (m.role === "user") return `<div class="msg right">${av("user")}<div class="col"><div class="name"><b>你</b><span class="tag">原始需求</span><span class="num">${clock(m.at)}</span></div><div class="bubble plain">${block(m.text)}</div></div></div>`;
  if (m.role === "interviewer") {
    const seat = seatOf(S,"interviewer");
    const qs = m.questions.length ? m.questions.map(q => `<div class="item"><div class="qh"><span class="qid">${esc(q.id)}</span><h3>${inline(q.title || "（无标题）")}</h3></div>${q.body?`<div class="qbody">${block(q.body)}</div>`:""}${q.recommendation?`<div class="rec">${ARROW}<span class="lbl">推荐</span><span>${inline(q.recommendation)}</span></div>`:""}</div>`).join("") : `<div class="item qbody">这一轮的提问文件里没读到 Q 编号的问题。</div>`;

  }
  if (m.role === "proxy") {
    const seat = seatOf(S,"proxy");
    const as = m.answers.length ? m.answers.map(a => {
      const open = /^open\b/i.test(a.decision || "");

        a.kind && `<span class="fact${/fact|side-effect/i.test(a.kind)?" warn":""}">${esc(KIND[a.kind.toLowerCase()] || a.kind)}</span>`,
        a.confidence && `<span class="fact${/low/i.test(a.confidence)?" warn":""}"><i></i>信心${esc(CONF[a.confidence.toLowerCase()] || a.confidence)}</span>`,
        a.reversibility && `<span class="fact${/costly/i.test(a.reversibility)?" warn":""}">${/costly/i.test(a.reversibility)?"难回退":"可回退"}</span>`

function closing(m){
  const t = S.totals || {};

function typing(){

  const tp = typing();
  if (tp) list.push({key: "__typing", html: tp});
  if (!list.length) list.push({key: "__empty", html: `<div class="empty"><h2>还没有消息</h2><p>Interviewer 写出第一轮问题后，对话会出现在这里。</p></div>`});
  const keep = new Set(list.map(i => i.key));
  for (const [k, n] of nodes) if (!keep.has(k)) { n.el.remove(); nodes.delete(k); }
  let added = 0;
  list.forEach((item, i) => {
    let n = nodes.get(item.key);
    if (!n || n.html !== item.html) {
      const el = document.createElement("div");
      el.style.display = "contents";
      el.innerHTML = item.html;
      if (!n && !first && item.key !== "__typing") { el.firstElementChild?.classList.add("enter"); added++; }
      if (!n && item.key === "__typing" && !first) el.querySelector(".msg,.judge")?.classList.add("enter");
      if (n) n.el.replaceWith(el);
      n = {el, html: item.html};
      nodes.set(item.key, n);
    }
    if (chat.children[i] !== n.el) chat.insertBefore(n.el, chat.children[i] || null);
  });
  if (stick) requestAnimationFrame(() => window.scrollTo({top: document.documentElement.scrollHeight, behavior: first ? "auto" : "smooth"}));
  else if (added) $("jump").hidden = false;
}

function setLive(phase){
  const el = $("live");
  const label = gone ? (S?.phase === "live" ? "重新连接中" : "页面已停止更新") : {live:"直播中",done:"已结束",failed:"已中断",connecting:"连接中"}[phase] || phase;
  el.dataset.s = gone ? "connecting" : phase;
  el.lastElementChild.textContent = label;
}

function tick(){
  if (!S) return;
  const end = S.endedAt || now();
  $("elapsed").textContent = mm(end - S.startedAt);
  document.querySelectorAll("[data-since]").forEach(el => { el.textContent = mm(now() - Number(el.dataset.since)); });
}
setInterval(tick, 1000);

window.addEventListener("scroll", () => { if (nearBottom()) $("jump").hidden = true; }, {passive: true});
$("jump").addEventListener("click", () => { window.scrollTo({top: document.documentElement.scrollHeight, behavior: "smooth"}); $("jump").hidden = true; });
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "已复制"; }
  catch { b.textContent = "复制失败，请手动选中"; }
  setTimeout(() => { b.textContent = "复制路径"; }, 1800);
});

function connect(){
  const es = new EventSource("events");
  es.onmessage = e => { try { apply(JSON.parse(e.data)); tick(); } catch (err) { console.error(err); } };
  es.onerror = () => {
    gone = true; setLive(S?.phase || "connecting");
    if (!S) $("chat").innerHTML = `<div class="empty"><h2>页面服务没有响应</h2><p>这场拷问的直播服务可能已经结束。决策日志在目标仓库的 <code>docs/grill/</code> 下。</p></div>`;
  };
  es.onopen = () => { if (gone) { gone = false; setLive(S?.phase || "connecting"); } };
}
connect();
</script>
